name: CI Build & Package

on:
  push:
    branches:
      - main
      - "feat/**"
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "docs/**"
      - ".agents/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "docs/**"
      - ".agents/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Mobile Web & OTA Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify pure mobile web bundle & OTA package generation
        run: |
          npm run mobile:build:web
          test ! -e dist-web/server.js
          test ! -e dist-web/agent
          test ! -e dist-web/executor
          npm run build:ota
          test -f dist-ota/version-manifest.json
          test -f dist-ota/twinklebot-core-desktop.tar.gz
          test -f dist-ota/twinklebot-web-desktop.tar.gz
          test -f dist-ota/twinklebot-web-mobile.tar.gz
