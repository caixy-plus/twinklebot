name: Publish GitHub Release & OTA Channel

on:
  push:
    tags:
      - "v*"
      - "ota-[0-9]*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode: ota-only (fast pure-frontend hot update) or full (all platform installers + OTA)"
        required: true
        default: "ota-only"
        type: choice
        options:
          - ota-only
          - full
      release_tag:
        description: "Optional explicit tag (e.g. ota-20261118.1 or v1.0.0; auto-generated for ota-only if empty)"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Optional short release summary shown in update card"
        required: false
        default: ""
        type: string
      e2e_level:
        description: "Optional CI pre-release E2E level (default: skip — tests run locally)"
        required: true
        default: "skip"
        type: choice
        options:
          - skip
          - affected+p0
          - all
          - p0+p1
          - p0
          - affected

permissions:
  contents: write

concurrency:
  group: twinklebot-release-channel
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release Mode & Prepare Draft
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_notes: ${{ steps.meta.outputs.release_notes }}
      web_build_id: ${{ steps.meta.outputs.web_build_id }}
      e2e_level: ${{ steps.meta.outputs.e2e_level }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release parameters
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          STAMP=$(date -u +"%Y%m%d.%H%M")
          WEB_STAMP=$(date -u +"%Y%m%d.%H%M%S")
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF_TAG="${{ github.ref_name }}"
            if [[ "$REF_TAG" == "ota-channel" ]]; then
              echo "::error::ota-channel is a rolling release pointer tag and must never trigger release builds."
              exit 1
            fi
            if [[ "$REF_TAG" == v* ]]; then
              MODE="full"
            else
              MODE="ota-only"
            fi
            TAG="$REF_TAG"
            NOTES=""
            E2E_LEVEL="skip"
          else
            MODE="${{ inputs.mode }}"
            INPUT_TAG="${{ inputs.release_tag }}"
            NOTES="${{ inputs.release_notes }}"
            E2E_LEVEL="${{ inputs.e2e_level || 'skip' }}"
            if [[ -n "$INPUT_TAG" ]]; then
              TAG="$INPUT_TAG"
            elif [[ "$MODE" == "full" ]]; then
              TAG="v${PKG_VER}"
            else
              TAG="ota-${STAMP}.${GITHUB_RUN_NUMBER}"
            fi
          fi
          if [[ "$MODE" == "full" ]]; then
            if [[ "$TAG" != "v${PKG_VER}" ]]; then
              echo "::error::Full release tag ($TAG) must match package.json version (v${PKG_VER}). Run 'npm run version:bump' before tagging."
              exit 1
            fi
            node -e '
              const v = process.argv[1];
              const m = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(v);
              if (!m || Number(m[2]) > 19 || Number(m[3]) > 9) {
                console.error(`Version "${v}" violates TwinkleBot convention (MINOR 0-19, PATCH 0-9).`);
                process.exit(1);
              }
            ' "$PKG_VER"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "web_build_id=$WEB_STAMP" >> "$GITHUB_OUTPUT"
          echo "e2e_level=$E2E_LEVEL" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE release_tag=$TAG web_build_id=$WEB_STAMP e2e_level=$E2E_LEVEL"

      - name: Prepare Draft Release in distribution repo (full mode)
        if: steps.meta.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TARGET_REF: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            gh release delete "$RELEASE_TAG" --repo "$TARGET_REPO" --yes || true
          else
            gh release delete "$RELEASE_TAG" --repo "$TARGET_REPO" --cleanup-tag --yes || true
          fi
          NOTES_TEXT="${RELEASE_NOTES:-TwinkleBot ${RELEASE_TAG} 全平台正式发布}"
          gh release create "$RELEASE_TAG" \
            --repo "$TARGET_REPO" \
            --target "$TARGET_REF" \
            --draft \
            --title "TwinkleBot ${RELEASE_TAG}" \
            --notes "$NOTES_TEXT"

  release-e2e:
    name: Pre-Release Automated E2E (${{ needs.prepare.outputs.e2e_level }})
    needs: prepare
    if: needs.prepare.outputs.e2e_level != 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E when explicitly requested
        if: needs.prepare.outputs.e2e_level == 'skip'
        run: echo "e2e_level=skip — skipping automated E2E gate as requested."

      - name: Checkout repository (with tags for release diff)
        if: needs.prepare.outputs.e2e_level != 'skip'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        if: needs.prepare.outputs.e2e_level != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system X11, SVG tools & official Google Chrome
        if: needs.prepare.outputs.e2e_level != 'skip'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin imagemagick xvfb xauth openbox xdotool wmctrl xclip x11-utils curl ca-certificates
          if ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb
            rm -f /tmp/chrome.deb
          fi

      - name: Install dependencies & build
        if: needs.prepare.outputs.e2e_level != 'skip'
        run: |
          npm ci
          npm run build:ts

      - name: Run configured pre-release E2E level
        if: needs.prepare.outputs.e2e_level != 'skip'
        env:
          TWINKLEBOT_E2E_HEADLESS: "1"
          E2E_LEVEL: ${{ needs.prepare.outputs.e2e_level }}
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" node scripts/run-e2e.mjs --clean --tier="$E2E_LEVEL" --since-last-tag

      - name: Publish E2E report to Job Summary
        if: always() && needs.prepare.outputs.e2e_level != 'skip'
        run: |
          if [ -f test-results/reports/latest.md ]; then
            cat test-results/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E failure evidence & report
        if: failure() && needs.prepare.outputs.e2e_level != 'skip'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            test-results/reports/latest.md
            test-results/e2e-summary.json
            test-results/evidence/
          retention-days: 7
          if-no-files-found: ignore

  publish-ota-only:
    name: Fast Core + Frontend OTA Release
    needs: [prepare, release-e2e]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.release-e2e.result == 'success' || needs.release-e2e.result == 'skipped') && needs.prepare.outputs.mode == 'ota-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & build TypeScript/Core runtime
        run: |
          npm ci
          npm run build:ts

      - name: Fetch previous authoritative version-manifest.json (inherit shell installer links)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          LEGACY_REPO: ${{ vars.LEGACY_RELEASE_REPO || '' }}
        run: |
          gh release download ota-channel --repo "$TARGET_REPO" -p "version-manifest.json" -O prev-manifest.json || \
          gh release download --repo "$TARGET_REPO" -p "version-manifest.json" -O prev-manifest.json || \
          { [ -n "$LEGACY_REPO" ] && gh release download ota-channel --repo "$LEGACY_REPO" -p "version-manifest.json" -O prev-manifest.json; } || true

      - name: Build OTA bundles & manifest
        env:
          WEB_BUILD_ID: "${{ needs.prepare.outputs.web_build_id }}"
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag }}"
          RELEASE_NOTES: "${{ needs.prepare.outputs.release_notes }}"
          TWINKLEBOT_GITHUB_REPO: "${{ vars.RELEASE_REPO || github.repository }}"
        run: |
          node scripts/build-ota-packages.mjs \
            --mode=ota-only \
            --release-tag="$RELEASE_TAG" \
            --base-manifest=prev-manifest.json
          cat dist-ota/version-manifest.json

      - name: Publish OTA Tag Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "TwinkleBot Core + Frontend OTA (${{ needs.prepare.outputs.release_tag }})"
          target_commitish: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist-ota/version-manifest.json
            dist-ota/twinklebot-core-desktop.tar.gz
            dist-ota/twinklebot-web-desktop.tar.gz
            dist-ota/twinklebot-web-mobile.tar.gz

      - name: Refresh rolling ota-channel pointer asset
        env:
          GH_TOKEN: ${{ vars.RELEASE_REPO && (secrets.RELEASE_PAT || secrets.GITHUB_TOKEN) || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TARGET_REF: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
        run: |
          gh release delete ota-channel --repo "$TARGET_REPO" --cleanup-tag --yes || true
          gh release create ota-channel dist-ota/version-manifest.json \
            --repo "$TARGET_REPO" \
            --target "$TARGET_REF" \
            --prerelease \
            --title "TwinkleBot Authoritative Update Channel" \
            --notes "Active version-manifest.json pointer (${{ needs.prepare.outputs.release_tag }})."

      - name: Mirror OTA release & manifest to legacy repository (transitional)
        if: ${{ vars.LEGACY_RELEASE_REPO != '' && vars.LEGACY_RELEASE_REPO != (vars.RELEASE_REPO || github.repository) }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PRIMARY_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          LEGACY_REPO: ${{ vars.LEGACY_RELEASE_REPO }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p dist-ota-legacy
          node --input-type=module -e '
            import fs from "node:fs";
            import { rewriteManifestRepoUrls } from "./scripts/build-ota-packages.mjs";
            const raw = JSON.parse(fs.readFileSync("dist-ota/version-manifest.json", "utf8"));
            const rewritten = rewriteManifestRepoUrls(raw, process.env.PRIMARY_REPO, process.env.LEGACY_REPO);
            fs.writeFileSync("dist-ota-legacy/version-manifest.json", JSON.stringify(rewritten, null, 2));
          '
          gh release delete "$RELEASE_TAG" --repo "$LEGACY_REPO" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" \
            dist-ota-legacy/version-manifest.json \
            dist-ota/twinklebot-core-desktop.tar.gz \
            dist-ota/twinklebot-web-desktop.tar.gz \
            dist-ota/twinklebot-web-mobile.tar.gz \
            --repo "$LEGACY_REPO" \
            --target main \
            --prerelease \
            --title "TwinkleBot Core + Frontend OTA (${RELEASE_TAG})" \
            --notes "Mirrored OTA update from ${PRIMARY_REPO} (${RELEASE_TAG})."
          gh release delete ota-channel --repo "$LEGACY_REPO" --cleanup-tag --yes || true
          gh release create ota-channel dist-ota-legacy/version-manifest.json \
            --repo "$LEGACY_REPO" \
            --target main \
            --prerelease \
            --title "TwinkleBot Authoritative Update Channel" \
            --notes "Active version-manifest.json pointer (${RELEASE_TAG})."

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: [prepare, release-e2e]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.release-e2e.result == 'success' || needs.release-e2e.result == 'skipped') && needs.prepare.outputs.mode == 'full' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: electron:dist:mac
          - platform: windows
            os: windows-latest
            script: electron:dist:win
          - platform: linux
            os: ubuntu-latest
            script: electron:dist:linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package Electron desktop application (${{ matrix.platform }})
        run: npm run ${{ matrix.script }}

      - name: Upload desktop installers & SHA-256 metadata directly to Draft Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p release-meta
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const { execFileSync } = require("child_process");
            const exts = /\.(dmg|zip|exe|AppImage|tar\.gz)$/i;
            const files = fs.readdirSync("dist")
              .filter((f) => exts.test(f) && !f.endsWith(".blockmap"))
              .sort();
            if (files.length === 0) throw new Error("No packaged desktop files found in dist/");
            const meta = files.map((fileName) => {
              const buf = fs.readFileSync(path.join("dist", fileName));
              return {
                fileName,
                sha256: crypto.createHash("sha256").update(buf).digest("hex"),
                sizeBytes: buf.length,
              };
            });
            const metaPath = `release-meta/_asset-meta-${process.env.MATRIX_PLATFORM}.json`;
            fs.writeFileSync(metaPath, JSON.stringify(meta, null, 2));
            const filePaths = [...meta.map((m) => path.join("dist", m.fileName)), metaPath];
            console.log("Uploading to", process.env.TARGET_REPO, process.env.RELEASE_TAG, filePaths);
            execFileSync(
              "gh",
              ["release", "upload", process.env.RELEASE_TAG, ...filePaths, "--repo", process.env.TARGET_REPO, "--clobber"],
              { stdio: "inherit" }
            );
          '

  build-android:
    name: Build Android APK
    needs: [prepare, release-e2e]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.release-e2e.result == 'success' || needs.release-e2e.result == 'skipped') && needs.prepare.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Prepare Android SDK (API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Install dependencies, sync Capacitor Android & assemble APKs
        run: |
          npm ci
          APP_TARGET=mobile npm run mobile:build:web
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Sign, upload APKs & SHA-256 metadata to Draft Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p apk-output release-meta
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > /tmp/release.keystore
            chmod 600 /tmp/release.keystore
            ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort -V | tail -n 1)"
            APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)"
            "$ZIPALIGN" -p -f 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              /tmp/app-release-aligned.apk
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out apk-output/TwinkleBot-mobile-release.apk \
              /tmp/app-release-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs apk-output/TwinkleBot-mobile-release.apk
            rm -f /tmp/release.keystore /tmp/app-release-aligned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/TwinkleBot-mobile-debug.apk
          fi
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const files = fs.readdirSync("apk-output").filter((f) => /\.apk$/i.test(f)).sort();
            const meta = files.map((fileName) => {
              const buf = fs.readFileSync(path.join("apk-output", fileName));
              return {
                fileName,
                sha256: crypto.createHash("sha256").update(buf).digest("hex"),
                sizeBytes: buf.length,
              };
            });
            fs.writeFileSync("release-meta/_asset-meta-android.json", JSON.stringify(meta, null, 2));
          '
          gh release upload "$RELEASE_TAG" apk-output/*.apk release-meta/_asset-meta-android.json --repo "$TARGET_REPO" --clobber

  publish-full:
    name: Assemble Manifest & Publish Full Release
    needs: [prepare, build-desktop, build-android]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-desktop.result == 'success' && needs.build-android.result == 'success' && needs.prepare.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Download SHA-256 metadata files directly from Draft Release (0 Actions artifact storage)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag }}"
        run: |
          mkdir -p release-meta
          gh release download "$RELEASE_TAG" \
            --repo "$TARGET_REPO" \
            --pattern "_asset-meta-*.json" \
            --dir release-meta
          ls -lh release-meta/

      - name: Build OTA bundles & generate unified SHA-256 version-manifest.json
        env:
          WEB_BUILD_ID: "${{ needs.prepare.outputs.web_build_id }}"
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag }}"
          RELEASE_NOTES: "${{ needs.prepare.outputs.release_notes }}"
          TWINKLEBOT_GITHUB_REPO: "${{ vars.RELEASE_REPO || github.repository }}"
        run: |
          npm ci
          npm run build:ts
          node scripts/build-ota-packages.mjs \
            --mode=full \
            --assets-meta=release-meta \
            --release-tag="$RELEASE_TAG"
          ls -lh dist-ota/
          cat dist-ota/version-manifest.json

      - name: Upload OTA assets, clean temp metadata & publish Official GitHub Release
        env:
          GH_TOKEN: ${{ vars.RELEASE_REPO && (secrets.RELEASE_PAT || secrets.GITHUB_TOKEN) || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TARGET_REF: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag }}"
          RELEASE_NOTES: "${{ needs.prepare.outputs.release_notes }}"
        run: |
          gh release upload "$RELEASE_TAG" \
            dist-ota/version-manifest.json \
            dist-ota/twinklebot-core-desktop.tar.gz \
            dist-ota/twinklebot-web-desktop.tar.gz \
            dist-ota/twinklebot-web-mobile.tar.gz \
            --repo "$TARGET_REPO" \
            --clobber
          for f in release-meta/_asset-meta-*.json; do
            ASSET_NAME=$(basename "$f")
            gh release delete-asset "$RELEASE_TAG" "$ASSET_NAME" --repo "$TARGET_REPO" --yes || true
          done
          gh release edit "$RELEASE_TAG" \
            --repo "$TARGET_REPO" \
            --draft=false \
            --latest
          gh release delete ota-channel --repo "$TARGET_REPO" --cleanup-tag --yes || true
          gh release create ota-channel dist-ota/version-manifest.json \
            --repo "$TARGET_REPO" \
            --target "$TARGET_REF" \
            --prerelease \
            --title "TwinkleBot Authoritative Update Channel" \
            --notes "Active version-manifest.json pointer (${RELEASE_TAG})."

      - name: Mirror full release & manifest to legacy repository (transitional)
        if: ${{ vars.LEGACY_RELEASE_REPO != '' && vars.LEGACY_RELEASE_REPO != (vars.RELEASE_REPO || github.repository) }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PRIMARY_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          LEGACY_REPO: ${{ vars.LEGACY_RELEASE_REPO }}
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag }}"
          RELEASE_NOTES: "${{ needs.prepare.outputs.release_notes }}"
        run: |
          mkdir -p legacy-mirror-assets
          gh release download "$RELEASE_TAG" --repo "$PRIMARY_REPO" --dir legacy-mirror-assets
          node --input-type=module -e '
            import fs from "node:fs";
            import { rewriteManifestRepoUrls } from "./scripts/build-ota-packages.mjs";
            const manifestPath = "legacy-mirror-assets/version-manifest.json";
            const raw = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const rewritten = rewriteManifestRepoUrls(raw, process.env.PRIMARY_REPO, process.env.LEGACY_REPO);
            fs.writeFileSync(manifestPath, JSON.stringify(rewritten, null, 2));
          '
          NOTES_TEXT="${RELEASE_NOTES:-TwinkleBot ${RELEASE_TAG} 全平台正式发布（同步自 ${PRIMARY_REPO}）}"
          gh release delete "$RELEASE_TAG" --repo "$LEGACY_REPO" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" legacy-mirror-assets/* \
            --repo "$LEGACY_REPO" \
            --target main \
            --latest \
            --title "TwinkleBot ${RELEASE_TAG}" \
            --notes "$NOTES_TEXT"
          gh release delete ota-channel --repo "$LEGACY_REPO" --cleanup-tag --yes || true
          gh release create ota-channel legacy-mirror-assets/version-manifest.json \
            --repo "$LEGACY_REPO" \
            --target main \
            --prerelease \
            --title "TwinkleBot Authoritative Update Channel" \
            --notes "Active version-manifest.json pointer (${RELEASE_TAG})."
