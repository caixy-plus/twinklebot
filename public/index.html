<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem("color-scheme") ?? "light dark";
      } catch {}
      try {
        var _tbPref = (localStorage.getItem("twinklebot.language") || "system").toLowerCase();
        var _tbLocale =
          _tbPref === "en" || _tbPref.indexOf("en-") === 0
            ? "en"
            : _tbPref === "zh" || _tbPref === "zh-cn" || _tbPref.indexOf("zh-") === 0
              ? "zh-CN"
              : (navigator.language || "").toLowerCase().indexOf("zh") === 0
                ? "zh-CN"
                : "en";
        document.documentElement.lang = _tbLocale;
        document.documentElement.dataset.locale = _tbLocale;
      } catch {}
    </script>
    <title>TwinkleBot</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="stylesheet" href="./style.css?v=20261116a" />
    <link id="mobile-stylesheet" rel="stylesheet" href="./mobile.css?v=20261114d" />
    <script>
      if (window.twinklebotDesktop && window.twinklebotDesktop.isElectron) {
        document.documentElement.dataset.electron = "true";
        document.documentElement.dataset.platform = window.twinklebotDesktop.platform || "";
        var mLink = document.getElementById("mobile-stylesheet");
        if (mLink) mLink.media = "not all";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "/accounts-store.js": "./accounts-store.js",
          "/skills-catalog.js": "./skills-catalog.js",
          "/shared/": "./shared/"
        }
      }
    </script>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
