server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Redirect /twinklebot -> /twinklebot/ so relative ./assets resolve under /twinklebot/
    location = /twinklebot {
        return 301 $scheme://$http_host/twinklebot/;
    }

    # Serve TwinkleBot landing page at https://example.com/twinklebot/
    location /twinklebot/ {
        alias /var/www/twinklebot-landing/;
        index index.html;
        try_files $uri $uri/ =404;

        location ~* \.(css|js|png|svg|ico|webp)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Root domain and all other paths return 404
    location / {
        return 404;
    }
}
